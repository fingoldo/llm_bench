name: release

# Publishes to PyPI on a published GitHub Release (or a v* tag) using PyPI
# Trusted Publishing (OIDC) — no API token is stored as a secret.
#
# One-time setup on PyPI: add a Trusted Publisher for this repo pointing at
# this workflow file (release.yml) and the "pypi" environment below.
#
# NOTE: a successful upload requires the runtime dependency `pyutilz` to be
# available on PyPI; until then this workflow builds and validates but the
# upload step is the gating action to run only once that is true.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          fetch-depth: 0  # need full tag history for the workflow_dispatch guard below

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: false

      # Guard against a tag/version mismatch: a `release` event fires on a `v*`
      # tag, so the wheel version (from [project] version in pyproject.toml)
      # must equal that tag. Publishing a wheel whose version disagrees with
      # the tag is silent and unrecoverable on PyPI, so fail fast.
      - name: Assert git tag matches package version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::git tag ($TAG) != project version ($PKG)"; exit 1; }

      # workflow_dispatch has no tag to compare against -- it can be run
      # against ANY branch/ref, which previously meant a manual dispatch
      # skipped this guard entirely and could publish whatever version
      # happened to be in pyproject.toml on that ref with zero sanity check
      # (audit: 10-Medium). Instead require a `v<version>` tag to already
      # EXIST in the repo, so a manual publish can only ship a version that
      # went through the normal tagging step at least once.
      - name: Assert a matching release tag exists (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "package=$PKG"
          git rev-parse -q --verify "refs/tags/v$PKG" >/dev/null \
            || { echo "::error::no git tag v$PKG found -- manual dispatch refuses to publish an untagged version"; exit 1; }

      - name: Build distributions
        run: uv build

      - name: Verify distributions with twine
        run: uvx twine check dist/*

      - name: Upload built distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/llm-bench
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
