name: Black

# Filtered Black format check via the shared reusable workflow (fingoldo/py-ci-shared), mirroring
# mlframe's black-filtered.yml. Flags any Black finding EXCEPT blank-line insertion and arg/
# import-list explosion, which this project deliberately keeps unchanged (see
# .pre-commit-config.yaml's format-lint-warn / black hooks for the same rationale). This is the
# real CI gate; the repo's own pre-commit `black` hook stays manual-stage only so raw/unfiltered
# black never auto-churns a diff locally -- use
# `python -m py_ci_shared.black_filtered_apply --write <files>` for a sanctioned local pass.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  black:
    permissions:
      contents: read
    uses: fingoldo/py-ci-shared/.github/workflows/black-filtered.yml@9d0cc27e67fbee91ee00b357551c130e0b59a0eb  # v1.22.4
    with:
      py-ci-shared-ref: 9d0cc27e67fbee91ee00b357551c130e0b59a0eb  # v1.22.4
      check-path: src/llm_bench
